<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="noirBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#121216" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e7ce" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#d4af37" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#noirBg)" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4" />
  
  <!-- Crown / Flame -->
  <path d="M 256 100 L 275 140 L 256 160 L 237 140 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  <circle cx="215" cy="148" r="7" fill="url(#goldGrad)" />
  <circle cx="297" cy="148" r="7" fill="url(#goldGrad)" />
  
  <!-- Stylized N monogram -->
  <path d="M 180 180 L 220 180 L 220 340 L 180 340 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  <path d="M 292 180 L 332 180 L 332 340 L 292 340 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  <polygon points="215,180 250,180 332,335 297,335" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  
  <!-- Base underline -->
  <rect x="170" y="365" width="172" height="6" rx="3" fill="url(#goldGrad)" opacity="0.9" />
</svg>
